<!doctype html>
<meta charset="utf-8">
<style>html, body { margin: 0; } #player { width: 800px; height: 450px; }</style>
<div id="player"></div>
<pre id="result">pending</pre>
<script src="../dist/DPlayer.min.js"></script>
<script>
    const player = new DPlayer({
        container: document.getElementById('player'),
        lang: 'ja-jp',
        video: {url: '', type: 'normal'},
    });
    const selectors = ['.dplayer-video-wrap-aspect', '.dplayer-subtitle', '.dplayer-controller'];
    const bounds = selector => {
        const rect = document.querySelector(selector).getBoundingClientRect();
        return [rect.x, rect.y, rect.width, rect.height];
    };
    const before = selectors.map(bounds);
    const focusBefore = document.querySelectorAll('button,input,[tabindex]').length;
    const slot = document.querySelector('.dplayer-tlv-playback-damage');
    slot.dataset.state = 'recoverable';
    slot.textContent = '録画データが破損しています。停止時は4.4秒先へ移動します。 [TLV_SOURCE_DAMAGE]';
    const after = selectors.map(bounds);
    const focusAfter = document.querySelectorAll('button,input,[tabindex]').length;
    document.getElementById('result').textContent = JSON.stringify({
        boundsStable: JSON.stringify(before) === JSON.stringify(after),
        focusStable: focusBefore === focusAfter,
        before,
        after,
        focusBefore,
        focusAfter,
        notice: slot.textContent,
        noticeState: slot.dataset.state,
        noticeBounds: bounds('.dplayer-tlv-playback-damage'),
    });
    player.destroy();
</script>
